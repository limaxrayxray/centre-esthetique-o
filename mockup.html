<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup Hero — Centre Esthétique O</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --deep: #0a0a12;
    --violet: #3a2d9e;
    --blue: #4fc4f0;
    --white: #f0f0f5;
    --muted: #8888aa;
  }

  body {
    background: var(--deep);
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
  }

  /* ─── HERO ───────────────────────────────────── */
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  /* Giant offset logo */
  .hero-logo {
    position: absolute;
    right: -8%;
    top: 50%;
    transform: translateY(-50%);
    width: 75vh;
    height: 75vh;
    opacity: .12;
    pointer-events: none;
    filter: brightness(1.3);
  }

  /* Text side */
  .hero-text {
    position: relative;
    z-index: 2;
    padding-left: 8%;
    max-width: 55%;
  }

  .hero-label {
    font-family: system-ui, sans-serif;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: .8rem;
  }
  .hero-label::before {
    content: '';
    width: 32px;
    height: 1px;
    background: var(--blue);
  }

  .hero-title {
    font-size: clamp(3rem, 6.5vw, 6.5rem);
    font-weight: 300;
    line-height: 1.05;
    letter-spacing: -.02em;
    margin-bottom: 1.5rem;
  }
  .hero-title em {
    font-style: italic;
    font-weight: 400;
    color: var(--blue);
  }

  .hero-sub {
    font-size: clamp(1rem, 1.4vw, 1.3rem);
    font-weight: 300;
    color: var(--muted);
    line-height: 1.7;
    max-width: 480px;
    margin-bottom: 2.5rem;
    font-family: system-ui, sans-serif;
  }

  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    padding: .85rem 2.2rem;
    background: linear-gradient(135deg, var(--violet), #5540cc);
    color: #fff;
    font-family: system-ui, sans-serif;
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 3rem;
    transition: transform .2s, box-shadow .2s;
  }
  .hero-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(58,45,158,.4);
  }

  /* Subtle gradient overlay bottom */
  .hero::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(transparent, var(--deep));
    pointer-events: none;
  }

  /* Small logo in corner */
  .hero-logo-small {
    position: absolute;
    top: 32px;
    left: 8%;
    width: 36px;
    height: 36px;
    z-index: 5;
    opacity: .9;
  }

  /* ─── DIVIDER ────────────────────────────────── */
  .divider {
    padding: 120px 8%;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,.06);
  }
  .divider h2 {
    font-size: clamp(2rem, 4vw, 3.5rem);
    font-weight: 300;
    letter-spacing: -.01em;
    line-height: 1.2;
    margin-bottom: 1rem;
  }
  .divider h2 em {
    font-style: italic;
    font-weight: 400;
    color: var(--blue);
  }
  .divider p {
    color: var(--muted);
    font-family: system-ui, sans-serif;
    font-size: .95rem;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* ─── COLOR PALETTE PREVIEW ──────────────────── */
  .palette {
    display: flex;
    gap: 2px;
    padding: 60px 8%;
    border-top: 1px solid rgba(255,255,255,.06);
  }
  .palette-swatch {
    flex: 1;
    height: 80px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .08em;
    color: rgba(255,255,255,.7);
  }

  @media (max-width: 768px) {
    .hero-text { max-width: 85%; padding-left: 6%; }
    .hero-logo { width: 60vh; right: -20%; opacity: .08; }
  }
</style>
</head>
<body>

<!-- Hero -->
<section class="hero">
  <img class="hero-logo-small" src="logo.avif" alt="">

  <div class="hero-text">
    <div class="hero-label">Centre Esthétique O</div>
    <h1 class="hero-title">
      Révélez votre<br>
      <em>beauté naturelle</em>
    </h1>
    <p class="hero-sub">
      Des soins personnalisés, dispensés par nos expertes
      esthéticiennes dans un cadre apaisant.
    </p>
    <a href="tel:+14509659773" class="hero-cta">
      Prendre rendez-vous
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>

  <!-- Giant watermark logo -->
  <img class="hero-logo" src="logo.avif" alt="">
</section>

<!-- Section title example -->
<div class="divider">
  <h2>Nos <em>Prestations</em></h2>
  <p>Des soins du visage aux épilations, nous prenons soin de vous de la tête aux pieds.</p>
</div>

<!-- Color palette -->
<div class="palette">
  <div class="palette-swatch" style="background:#0a0a12;border:1px solid rgba(255,255,255,.1)">DEEP</div>
  <div class="palette-swatch" style="background:#3a2d9e">VIOLET</div>
  <div class="palette-swatch" style="background:#5540cc">PURPLE</div>
  <div class="palette-swatch" style="background:#4fc4f0">BLUE</div>
  <div class="palette-swatch" style="background:#f0f0f5;color:#222">WHITE</div>
</div>

</body>
</html>
